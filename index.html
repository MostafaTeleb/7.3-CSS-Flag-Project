<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    /*Red rect */
    .flag{
      background-color: red;
      height: 600px;
      width: 900px;
      position: relative;
    }

    /*blue rect */
    .flag >div{
      background-color: blue;
      height: 300px;
      width: 100%;
      position: absolute;
      top: 150px;

    }

    .flag >div>div{
      height: 200px;
      width: 200px;
      background-color: white;
      border-radius: 50%;
      position: relative;
      top: 50px;
      left: 350px;
    }
    p{margin: 0;
    font-size: 5rem;
    text-align: center;
    color: white;
}
/* toy can use this selector to change the color and you can go to chrome and right click then hit copy selector then paste it here
body > div.flag > div > div > p{color: black;}
*/
/*I sed this selector instead*/
div>div>p{
  color: black;
}

    
  
  </style>
</head>

  IMPORTANT! Do not change any HTML

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
